<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>wik.sh — Wikipedia Terminal</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#fff;--fg:#000;--dim:#999;--line:#ddd;--accent:#05b;--accent-hover:#07d;--font:'Courier New',monospace;--fs:14px;--lh:1.6;--pad:12px 20px;--radius:0px;--bar-bg:#000;--bar-fg:#fff;--card-bg:#f5f5f5;--card-border:#e0e0e0;--input-bg:#fafafa;--input-border:#ccc}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:var(--fs);line-height:var(--lh);overflow:hidden}
#splash{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:opacity .6s}
#splash.fade{opacity:0;pointer-events:none}#splash.hide{display:none}
#splash .logo{font-size:clamp(32px,8vw,80px);font-weight:800;letter-spacing:-4px;opacity:0;animation:fadeIn 1s .3s forwards;color:var(--fg)}
#splash .sub{color:var(--dim);font-size:clamp(11px,2vw,15px);margin-top:8px;opacity:0;animation:fadeIn .8s .7s forwards}
#splash .hint{font-size:clamp(10px,1.5vw,13px);margin-top:28px;opacity:0;animation:fadeIn .6s 1.4s forwards}
#splash .bar{width:min(240px,50vw);height:2px;background:var(--line);margin-top:20px;border-radius:1px;overflow:hidden;opacity:0;animation:fadeIn .3s .4s forwards}
#splash .bar div{height:100%;width:0;background:var(--fg);animation:fillBar 1.2s ease-out .5s forwards}
@keyframes fadeIn{to{opacity:1}}@keyframes fillBar{to{width:100%}}
#app{display:none;flex-direction:column;height:100vh}#app.active{display:flex}
#bar{background:var(--bar-bg);color:var(--bar-fg);padding:5px 14px;font-size:12px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;font-family:'Segoe UI',Arial,sans-serif}
#bar .l{display:flex;align-items:center;gap:8px}
#bar .l .d{width:10px;height:10px;border-radius:50%;background:#555;display:inline-block}
#bar .r{display:flex;gap:6px;align-items:center}
#bar .r button{background:none;border:none;color:var(--bar-fg);cursor:pointer;font-size:11px;padding:2px 8px;border-radius:3px;transition:background .15s;opacity:.7}
#bar .r button:hover{background:rgba(255,255,255,.15);opacity:1}
#bar .r .s{width:1px;height:14px;background:rgba(255,255,255,.2)}
#screen{flex:1;overflow-y:auto;padding:var(--pad);scroll-behavior:smooth;overscroll-behavior:contain}
#screen::-webkit-scrollbar{width:5px}#screen::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.l{white-space:pre-wrap;word-break:break-word;min-height:1.5em;padding:1px 0}
.l.d{color:var(--dim)}.l.s{border-bottom:1px solid var(--line);margin:6px 0}
.l.err{color:#c00}.l.ok{color:#090}
.l.r{margin:6px 0 4px;border-left:3px solid var(--accent);padding:10px 14px;background:var(--card-bg)}
.l.r .rt{font-size:calc(var(--fs) + 2px);font-weight:600;color:var(--accent);cursor:pointer}
.l.r .rt:hover{text-decoration:underline}
.l.r .ru{color:var(--dim);font-size:calc(var(--fs) - 2px);margin:1px 0;word-break:break-all}
.l.r .rs{margin-top:3px;opacity:.85}
.l.r .rm{color:var(--dim);font-size:calc(var(--fs) - 3px);margin-top:4px;display:flex;gap:12px;flex-wrap:wrap}
.l.r .rm span{cursor:pointer}.l.r .rm span:hover{color:var(--accent)}
.l.a{margin:4px 0}
.l.a .ah1{font-size:calc(var(--fs) + 8px);font-weight:700;margin:18px 0 4px}
.l.a .ah2{font-size:calc(var(--fs) + 4px);font-weight:600;margin:14px 0 3px}
.l.a .ah3{font-size:calc(var(--fs) + 1px);font-weight:600;margin:10px 0 2px}
.l.a .at{opacity:.85;margin-bottom:4px}
.l.a .al{color:var(--accent);cursor:pointer}
.l.a .al:hover{text-decoration:underline}
.l.a .aimg{margin:8px 0;max-width:100%}
.l.a .aimg img{max-width:100%;max-height:400px;border:1px solid var(--line);background:var(--card-bg)}
.l.a .asec{color:var(--dim);font-size:calc(var(--fs) - 2px);margin:10px 0 4px;font-weight:600}
.l.a .ainfo{border-left:2px solid var(--line);padding:6px 0 6px 12px;margin:6px 0;background:var(--card-bg)}
.l.cmdgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:4px 20px;margin:8px 0}
.l.cmdgrid .cg{display:flex;gap:6px;padding:3px 0}
.l.cmdgrid .cgk{color:var(--accent);font-weight:600;white-space:nowrap}
.l.cmdgrid .cgd{color:var(--dim)}
.tag{display:inline-block;padding:1px 8px;font-size:calc(var(--fs) - 3px);background:var(--card-bg);border:1px solid var(--line);margin:1px 3px;cursor:pointer;color:var(--dim)}
.tag:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.dl-btn{display:inline-block;padding:3px 12px;background:var(--accent);color:#fff;cursor:pointer;font-size:calc(var(--fs) - 2px);margin:2px 0;border-radius:3px}
.dl-btn:hover{opacity:.8}
#inputArea{display:flex;align-items:center;padding:6px 16px 10px;flex-shrink:0;background:var(--bg);border-top:1px solid var(--line)}
#prompt{color:var(--accent);margin-right:8px;white-space:nowrap;font-weight:600}
#cmd{flex:1;background:var(--input-bg);border:1px solid var(--input-border);color:var(--fg);font-family:var(--font);font-size:var(--fs);padding:8px 12px;outline:none}
#cmd:focus{border-color:var(--accent)}
#suggest{position:absolute;bottom:52px;left:16px;right:16px;max-height:240px;overflow-y:auto;background:var(--bg);border:1px solid var(--line);display:none;z-index:50}
#suggest.active{display:block}
#suggest .si{padding:5px 12px;cursor:pointer}
#suggest .si:hover,#suggest .si.hl{background:var(--card-bg);color:var(--accent)}
#settings{position:fixed;top:0;right:-420px;width:400px;max-width:92vw;height:100%;background:var(--bg);border-left:1px solid var(--line);z-index:200;transition:right .35s;overflow-y:auto}
#settings.open{right:0}
#settings .sh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
#settings .sh h3{font-size:16px;font-weight:700}
#settings .sb{padding:16px 20px}
#settings .sg{margin-bottom:20px}
#settings .sg h4{font-size:13px;color:var(--dim);margin-bottom:8px;font-weight:600;text-transform:uppercase}
#settings .sf{margin-bottom:14px}
#settings .sf label{display:block;font-size:12px;color:var(--dim);margin-bottom:3px}
#settings .sf input[type=color]{width:100%;height:36px;border:1px solid var(--line);cursor:pointer;padding:2px}
#settings .sf input[type=range]{width:100%;accent-color:var(--accent)}
#settings .sf select{width:100%;padding:6px 8px;background:var(--input-bg);border:1px solid var(--input-border);color:var(--fg);font-size:13px}
#settings .sf .val{font-size:11px;color:var(--dim);text-align:right;margin-top:1px}
#settings .sreset{width:100%;padding:8px;background:var(--fg);color:var(--bg);border:none;font-size:13px;cursor:pointer;font-weight:600}
#overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.3);z-index:199;display:none}
#overlay.open{display:block}
#toast{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);background:var(--bar-bg);color:var(--bar-fg);padding:8px 20px;border-radius:6px;font-size:13px;z-index:300;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.show{opacity:1}
</style>
</head>
<body>
<div id="splash"><div class="logo">wik.sh</div><div class="sub">Wikipedia terminal — knowledge at your fingertips</div><div class="bar"><div></div></div><div class="hint">click anywhere to enter</div></div>
<div id="app"><div id="bar"><div class="l"><span class="d"></span> wik.sh — wikipedia terminal</div><div class="r"><button onclick="cmdSettings()" title="Settings">&#9881;</button><span class="s"></span><button onclick="cmdRandom()" title="Random">&#8635;</button><button onclick="cmdBookmarks()" title="Bookmarks">&#9733;</button><button onclick="cmdClear()" title="Clear">&#9744;</button><span class="s"></span><button onclick="reboot()" title="Exit">&#10005;</button></div></div><div id="screen"></div><div id="suggest"></div><div id="inputArea"><span id="prompt">$</span><input id="cmd" type="text" placeholder="type 'help' to start, or just type anything to search" autofocus spellcheck="false" autocomplete="off"></div></div>
<div id="overlay" onclick="closeSettings()"></div>
<div id="settings"><div class="sh"><h3>Settings</h3><button onclick="closeSettings()">&times;</button></div><div class="sb" id="settingsBody"></div></div>
<div id="toast"></div>

<script>
var MAX_HIST=500,PER_PAGE=12;
var lang='en',cmdHistory=[],histIdx=0,searchResults=[],searchQuery='',searchOffset=0,searchTotal=0,currentArticle=null,currentArticleFull=null,currentFindResults=[];

var screenEl=document.getElementById('screen'),cmdEl=document.getElementById('cmd'),suggestEl=document.getElementById('suggest'),splashEl=document.getElementById('splash'),toastEl=document.getElementById('toast');

function api(action,params){
  params=Object.assign({format:'json',origin:'*',action:action},params);
  return fetch('https://'+lang+'.wikipedia.org/w/api.php?'+new URLSearchParams(params))
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()});
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function toastMsg(msg,dur){
  toastEl.textContent=msg;toastEl.classList.add('show');
  clearTimeout(toastEl._t);toastEl._t=setTimeout(function(){toastEl.classList.remove('show')},dur||2500);
}

var STORAGE_KEY='wikish_settings',BOOKMARKS_KEY='wikish_bookmarks';
var DEFAULTS={bg:'#ffffff',fg:'#000000',dim:'#999999',accent:'#0055bb',accentHover:'#0077dd',line:'#dddddd',cardBg:'#f5f5f5',cardBorder:'#e0e0e0',inputBg:'#fafafa',inputBorder:'#cccccc',barBg:'#000000',barFg:'#ffffff',font:'Courier New, monospace',fs:'14',lh:'1.6',padX:'20',padY:'12',radius:'0'};

function loadSettings(){
  try{var s=JSON.parse(localStorage.getItem(STORAGE_KEY));return s?Object.assign({},DEFAULTS,s):Object.assign({},DEFAULTS)}
  catch(e){return Object.assign({},DEFAULTS)}}
function saveSettings(s){localStorage.setItem(STORAGE_KEY,JSON.stringify(s))}
var SETTINGS=loadSettings();

function applySettings(s){
  var r=document.documentElement.style;
  r.setProperty('--bg',s.bg);r.setProperty('--fg',s.fg);r.setProperty('--dim',s.dim);
  r.setProperty('--accent',s.accent);r.setProperty('--accent-hover',s.accentHover);
  r.setProperty('--line',s.line);r.setProperty('--card-bg',s.cardBg);r.setProperty('--card-border',s.cardBorder);
  r.setProperty('--input-bg',s.inputBg);r.setProperty('--input-border',s.inputBorder);
  r.setProperty('--bar-bg',s.barBg);r.setProperty('--bar-fg',s.barFg);
  r.setProperty('--font',s.font);r.setProperty('--fs',s.fs+'px');
  r.setProperty('--lh',s.lh);r.setProperty('--pad',s.padY+'px '+s.padX+'px');
  r.setProperty('--radius',s.radius+'px');
}

function getBookmarks(){
  try{return JSON.parse(localStorage.getItem(BOOKMARKS_KEY))||[]}
  catch(e){return []}}
function saveBookmarks(b){localStorage.setItem(BOOKMARKS_KEY,JSON.stringify(b))}

function downloadBlob(content,filename,mime){
  var blob=new Blob([content],{type:mime});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;a.download=filename;
  document.body.appendChild(a);a.click();
  document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(url)},1000);
}

function downloadUrl(url,fname){
  var a=document.createElement('a');
  a.href=url;a.download=fname||url.split('/').pop();
  document.body.appendChild(a);a.click();
  document.body.removeChild(a);
}

function sanitize(s){
  return s.replace(/[<>:\x22\/\\\\|?*]/g,'_').replace(/\s+/g,'_').substring(0,200);
}

// ---- Boot ----
function boot(){
  applySettings(SETTINGS);
  splashEl.classList.add('fade');
  setTimeout(function(){splashEl.classList.add('hide');document.getElementById('app').classList.add('active');cmdEl.focus()},600);
  setTimeout(function(){
    w('Type "help" for commands, "random" for a random article.',{d:true});
    line();
    fetchRandom();
  },900);
  histIdx=0;
}

function reboot(){
  document.getElementById('app').classList.remove('active');
  splashEl.classList.remove('fade','hide');
  searchResults=[];currentArticle=null;currentArticleFull=null;currentFindResults=[];cmdHistory=[];histIdx=0;
  screenEl.innerHTML='';cmdEl.value='';
}

// ---- Screen ----
function w(text,opts){
  opts=opts||{};
  var el=document.createElement('div');el.className='l';
  if(opts.d)el.classList.add('d');if(opts.r)el.classList.add('r');
  if(opts.a)el.classList.add('a');if(opts.s)el.classList.add('s');
  if(opts.e)el.classList.add('err');
  if(opts.ok)el.classList.add('ok');
  el.innerHTML=text;
  screenEl.appendChild(el);screenEl.scrollTop=screenEl.scrollHeight;
  return el;
}
function line(){w('<div class="s"></div>',{s:true})}
function clearScr(){screenEl.innerHTML='';suggestEl.classList.remove('active')}

function writeResult(r,idx){
  var title=r.title||'',pageUrl='https://'+lang+'.wikipedia.org/wiki/'+encodeURIComponent(title.replace(/ /g,'_'));
  var snip=r.snippet||'',ts=r.timestamp?r.timestamp.slice(0,10):'';
  var size=r.size?fmtSize(r.size):'',wc=r.wordcount?r.wordcount.toLocaleString()+' words':'';
  w('<div class="r">'+
    '<div class="rt" onclick="runCmd(\'open '+esc(title.replace(/'/g,"\\'"))+'\')">'+esc(title)+'</div>'+
    '<div class="ru">'+esc(pageUrl)+'</div>'+
    (snip?'<div class="rs">'+snip+'...</div>':'')+
    '<div class="rm">'+
      (ts?'<span onclick="runCmd(\'search '+esc(ts.replace(/'/g,"\\'"))+'\')">'+ts+'</span>':'')+
      (size?'<span>'+size+'</span>':'')+(wc?'<span>'+wc+'</span>':'')+
      '<span style="color:var(--accent)">#'+idx+'</span>'+
    '</div></div>',{r:true});
}

function fmtSize(b){var kb=b/1024;return kb<1024?kb.toFixed(0)+'KB':(kb/1024).toFixed(1)+'MB'}

function resolveTitle(i){
  var m=i.match(/^#?(\d+)$/);
  if(m&&searchResults.length){var idx=parseInt(m[1])-1;if(idx>=0&&idx<searchResults.length)return searchResults[idx].title}
  return i;
}

function linkify(text){
  return text.replace(/\[\[([^\]]+)\]\]/g,function(m,t){
    var parts=t.split('|'),title=parts[0],label=parts[1]||title;
    return '<span class="al" onclick="runCmd(\'open '+esc(title.replace(/'/g,"\\'"))+'\')">'+esc(label)+'</span>';
  });
}

// ---- Commands ----
function process(input){
  var parts=input.trim().split(/\s+/),c=parts[0].toLowerCase(),a=parts.slice(1).join(' ');
  if(!input.trim())return;
  addHist(input);
  if(c==='help'||c==='h')cmdHelp();
  else if(c==='search'||c==='s')cmdSearch(a);
  else if(c==='open'||c==='o')cmdOpen(a);
  else if(c==='read'||c==='cat')cmdRead(a);
  else if(c==='random'||c==='r')cmdRandom();
  else if(c==='more'||c==='m')cmdMore();
  else if(c==='back')cmdBack();
  else if(c==='clear'||c==='cls')cmdClear();
  else if(c==='history'||c==='hist')cmdHist();
  else if(c==='related'||c==='rel')cmdRelated();
  else if(c==='lang')cmdLang(a);
  else if(c==='top')cmdTop();
  else if(c==='images'||c==='img')cmdImages(a);
  else if(c==='links')cmdLinks(a);
  else if(c==='categories'||c==='cats')cmdCats(a);
  else if(c==='suggestions'||c==='sug')cmdSuggestions(a);
  else if(c==='geosearch'||c==='geo')cmdGeo(a);
  else if(c==='feed')cmdFeed();
  else if(c==='featured')cmdFeatured();
  else if(c==='settings'||c==='prefs')cmdSettings();
  else if(c==='about')cmdAbout();
  else if(c==='download'||c==='dl')cmdDownload(a);
  else if(c==='dlhtml')cmdDownloadHtml(a);
  else if(c==='dlmd')cmdDownloadMarkdown(a);
  else if(c==='dlimg')cmdDownloadImages(a);
  else if(c==='save'||c==='bookmark')cmdSave(a);
  else if(c==='bookmarks'||c==='bm')cmdBookmarks();
  else if(c==='remove'||c==='rmbm')cmdRemoveBm(a);
  else if(c==='stats')cmdStats(a);
  else if(c==='toc')cmdToc(a);
  else if(c==='find')cmdFind(a);
  else if(c==='export')cmdExport();
  else if(!isNaN(Number(c))&&c.length<4&&searchResults.length){
    var idx=parseInt(c)-1;if(idx>=0&&idx<searchResults.length)cmdOpen(searchResults[idx].title);
    else w('Result #'+c+' not found.',{d:true});
  }
  else if(c.charAt(0)==='#'){
    var idx=parseInt(c.slice(1))-1;if(idx>=0&&idx<searchResults.length)cmdOpen(searchResults[idx].title);
    else w('Result #'+c.slice(1)+' not found.',{d:true});
  }
  else cmdSearch(input);
  suggestEl.classList.remove('active');
}

// ---- Help ----
function cmdHelp(){
  clearScr();
  w('<div class="ah1">wik.sh — Commands</div>');
  w('<div class="at" style="margin-bottom:12px">Click any command to run it. Click article titles to open them.</div>');
  var cmds=[
    ['search <q> / s','Full-text search'],['open <t> / o','Open article inline'],
    ['read <t>','Read full article body'],['random / r','Random article'],
    ['more / m','Next search page'],['back','Return to search results'],
    ['images <t>','Images in article'],['links <t>','Internal links'],
    ['categories <t>','Categories'],['suggestions <q>','Autocomplete'],
    ['geosearch <lat> <lon>','Near coordinates'],['feed','Random collection'],
    ['featured','Featured article'],['top','Most-read today'],
    ['related / rel','Related articles'],['lang <code>','Change language'],
    ['history / hist','Command history'],['settings / prefs','Customize appearance'],
    ['about','About'],['clear / cls','Clear screen'],
    ['','Download & Export --'],
    ['download <t> / dl','Download as .txt'],['dlhtml <t>','Download as .html'],
    ['dlmd <t>','Download as Markdown'],['dlimg <t>','Download all images'],
    ['export','Export bookmarks as JSON'],
    ['','Bookmarks --'],
    ['save <t> / bookmark','Save to bookmarks'],['bookmarks / bm','Show bookmarks'],
    ['remove <n> / rmbm','Remove bookmark'],
    ['','Analysis --'],
    ['stats <t>','Article statistics'],['toc <t>','Table of contents'],
    ['find <text>','Search within article']];
  w('<div class="cmdgrid">'+cmds.map(function(cd){
    return cd[0]?'<div class="cg"><span class="cgk" onclick="runCmd(\''+cd[0].split(' ')[0]+'\')">'+esc(cd[0])+'</span><span class="cgd">-- '+esc(cd[1])+'</span></div>':'<div class="cg" style="grid-column:1/-1;color:var(--dim);font-weight:600;margin-top:4px">'+esc(cd[1])+'</div>'
  }).join('')+'</div>');
  w('<div class="at" style="margin-top:12px">Tip: Just type anything to search. Arrow keys for history. Click links to open inline.</div>');
}

// ---- Search ----
function cmdSearch(q){
  if(!q){cmdHelp();return}
  searchQuery=q;searchOffset=0;
  w('Searching "'+esc(q)+'"...',{d:true});
  doSearch(q,0);
}
function doSearch(q,offset,append){
  api('query',{list:'search',srsearch:q,srlimit:PER_PAGE,sroffset:offset,srprop:'snippet|titlesnippet|timestamp|size|wordcount',srwhat:'text'}).then(function(d){
    var qr=d.query||{},results=qr.search||[];
    searchTotal=qr.searchinfo&&qr.searchinfo.totalhits||0;
    if(!append)searchOffset=0;searchOffset=offset+results.length;
    if(!append)searchResults=results;else searchResults=searchResults.concat(results);
    renderSearch(results,q,offset);
    if(results.length){
      var p=Math.floor(offset/PER_PAGE)+1,tp=Math.ceil(searchTotal/PER_PAGE);
      w('Page '+p+'/'+tp+' ('+searchTotal.toLocaleString()+' total) -- <span style="cursor:pointer;color:var(--accent)" onclick="runCmd(\'more\')">type "more" for next page</span>',{d:true});
    } else if(offset===0){w('No results for "'+esc(q)+'".',{d:true})}
  }).catch(function(e){w('Error: '+esc(e.message),{e:true})});
}
function renderSearch(results,q,offset){
  if(offset===0){line();w('Search: "'+esc(q)+'" -- '+searchTotal.toLocaleString()+' results',{d:true});line()}
  for(var i=0;i<results.length;i++)writeResult(results[i],offset+i+1);
}

// ---- Open Article ----
function cmdOpen(t){
  if(!t){w('Usage: open <title>',{d:true});return}
  t=resolveTitle(t);
  w('Opening "'+esc(t)+'"...',{d:true});
  Promise.all([
    api('query',{prop:'extracts|pageimages|info',exintro:1,explaintext:1,titles:t,inprop:'url',pithumbsize:600}),
    api('query',{prop:'images',titles:t,imlimit:20}),
    api('query',{prop:'categories',titles:t,cllimit:10}),
    api('query',{prop:'pageprops',titles:t,ppprop:'wikibase_item'})
  ]).then(function(res){
    var data=res[0],imgData=res[1],catData=res[2],ppData=res[3];
    var pages=data.query&&data.query.pages||{},id=Object.keys(pages)[0];
    if(!id||id==='-1'){w('Article not found: "'+esc(t)+'"',{e:true});return}
    var p=pages[id],ext=p.extract||'',img=p.thumbnail&&p.thumbnail.source||'';
    var url=p.canonicalurl||'https://'+lang+'.wikipedia.org/wiki/'+encodeURIComponent(t.replace(/ /g,'_'));
    currentArticle=p;
    line();
    w('<div class="a"><div class="ah1">'+esc(p.title)+'</div></div>');
    if(img)w('<div class="a"><div class="aimg"><img src="'+esc(img)+'" alt="'+esc(p.title)+'" loading="lazy"></div></div>');
    var tags=[];
    var imgs=imgData.query&&imgData.query.pages&&imgData.query.pages[id]&&imgData.query.pages[id].images||[];

      if(imgs.length>5)w('<div class="a"><div class="at" style="color:var(--dim)">... and '+(imgs.length-5)+' more (type "images '+esc(p.title.replace(/'/g,"\\'"))+'")</div></div>');

      w('<div class="a"><div class="at">'+cats.map(function(c){return '<span class="tag" onclick="runCmd(\'search '+esc(c.title.replace('Category:','').replace(/'/g,"\\'"))+'\')">'+esc(c.title.replace('Category:',''))+'</span>'}).join(' ')+'</div></div>');
    }
    api('query',{prop:'links',titles:t,pllimit:15}).then(function(ld){
      var lp=ld.query&&ld.query.pages||{},li=lp[id]&&lp[id].links||[];
      if(li.length){
        w('<div class="a"><div class="asec">Links</div></div>');

      }

    w('<div class="a"><div class="at" style="margin-top:8px;color:var(--dim)">Type "related" for more | "read" for full text | "download" to save | "stats" for analysis</div></div>');

function fetchRelated(title){
  var terms=title.split(/\s+/).filter(function(w){return w.length>3}).slice(0,3).join(' ');
  var doRender=function(d){
    var items=d.query&&d.query.search||d.query&&d.query.categorymembers||[];
    var rel=items.filter(function(x){return x.title}).filter(function(x){return x.title!==title}).slice(0,8);
    if(rel.length){
      line();w('Related to "'+esc(title)+'":',{d:true});
      for(var ri=0;ri<rel.length;ri++)w('<div class="a"><div class="at"><span class="al" onclick="runCmd(\'open '+esc(rel[ri].title.replace(/'/g,"\\'"))+'\')">'+esc(rel[ri].title)+'</span></div></div>');
    } else {w('No related found.',{d:true})}
  };
  if(terms){api('query',{list:'search',srsearch:terms,srlimit:8,srwhat:'title'}).then(doRender).catch(function(){})}
  else {
    api('query',{prop:'categories',titles:title,cllimit:5}).then(function(cd){
      var cp=cd.query&&cd.query.pages||{},id=Object.keys(cp)[0];
      if(id&&cp[id]&&cp[id].categories&&cp[id].categories[0])
        api('query',{list:'categorymembers',cmtitle:cp[id].categories[0].title,cmlimit:8}).then(doRender).catch(function(){});
    }).catch(function(){});
  }
}

function cmdDownloadMarkdown(t){
  if(!t){w('Usage: dlmd <title>',{d:true});return}
  t=resolveTitle(t);
  w('Preparing "'+esc(t)+'" as Markdown...',{d:true});
  api('query',{prop:'extracts|info',explaintext:1,exlimit:1,titles:t,inprop:'url'}).then(function(d){
    var pages=d.query&&d.query.pages||{},id=Object.keys(pages)[0];
    if(!id||id==='-1'){w('Not found.',{e:true});return}
    var p=pages[id],ext=p.extract||'No content.',url=p.canonicalurl||'https://'+lang+'.wikipedia.org/wiki/'+encodeURIComponent(t.replace(/ /g,'_'));
    var md='# '+p.title+'\n\n';
    md+='> Source: ['+url+']('+url+')  \n';
    md+='> Language: '+lang+' | Downloaded: '+new Date().toISOString().slice(0,10)+'\n\n';
    md+='---\n\n';
    var sections=ext.split('\n');
    for(var si=0;si<sections.length;si++){
      var line=sections[si].trim();
      if(line.indexOf('== ')===0&&line.lastIndexOf(' ==')===line.length-3){
        md+='\n## '+line.replace(/==\s*/g,'').trim()+'\n\n';
      } else if(line.indexOf('=== ')===0&&line.lastIndexOf(' ===')===line.length-4){
        md+='\n### '+line.replace(/===\s*/g,'').trim()+'\n\n';
      } else {
        var wikilinked=line.replace(/\[\[([^\]]+)\]\]/g,function(m,wt){var p2=wt.split('|');return '['+(p2[1]||p2[0])+'](https://'+lang+'.wikipedia.org/wiki/'+encodeURIComponent(p2[0].replace(/ /g,'_'))+')'});
        if(wikilinked.trim())md+=wikilinked+'\n\n';
      }
    }
    downloadBlob(md,sanitize(p.title)+'.md','text/markdown');
    w('Downloaded "'+esc(p.title)+'" as .md ('+(md.length/1024).toFixed(1)+'KB)',{ok:true});
  }).catch(function(e){w('Error: '+esc(e.message),{e:true})});
}

// ---- Download Images ----
function cmdDownloadImages(t){
  if(!t){w('Usage: dlimg <title>',{d:true});return}
  t=resolveTitle(t);
  w('Fetching image URLs from "'+esc(t)+'"...',{d:true});
  api('query',{prop:'images',titles:t,imlimit:50}).then(function(d){
    var pages=d.query&&d.query.pages||{},id=Object.keys(pages)[0];
    if(!id||id==='-1'){w('Not found.',{e:true});return}
    var imgs=pages[id].images||[];
    if(!imgs.length){w('No images.',{d:true});return}
    var imgTitles=imgs.map(function(i){return i.title}).join('|');
    api('query',{prop:'imageinfo',titles:imgTitles,iiprop:'url|mime',iilimit:50}).then(function(id2){
      var ipages=id2.query&&id2.query.pages||{};
      var urls=[];
      for(var k in ipages){
        if(ipages[k].imageinfo&&ipages[k].imageinfo[0]){
          var info=ipages[k].imageinfo[0];
          if(info.mime&&info.mime.indexOf('image/')===0)urls.push({url:info.url,title:ipages[k].title});
        }
      }
      if(!urls.length){w('No downloadable images found.',{d:true});return}
      w('Found '+urls.length+' downloadable images:',{ok:true});
      line();
      for(var ui=0;ui<urls.length;ui++){
        var fname=urls[ui].url.split('/').pop().split('?')[0]||('image_'+(ui+1)+'.jpg');
        w('<div class="a"><div class="at"><span style="color:var(--dim)">'+(ui+1)+'.</span> <span class="dl-btn" onclick="downloadUrl(\''+esc(urls[ui].url)+'\',\''+esc(fname)+'\')">Download</span> '+esc(urls[ui].title)+'</div></div>');
      }
      line();
      w('Click each download button to save images.',{d:true});
    }).catch(function(e){w('Error getting image URLs: '+esc(e.message),{e:true})});
  }).catch(function(e){w('Error: '+esc(e.message),{e:true})});
}

// ---- Save / Bookmark ----
function cmdSave(t){
  if(!t){w('Usage: save <title>',{d:true});return}
  t=resolveTitle(t);
  api('query',{prop:'info|extracts',exintro:1,explaintext:1,titles:t,inprop:'url'}).then(function(d){
    var pages=d.query&&d.query.pages||{},id=Object.keys(pages)[0];
    if(!id||id==='-1'){w('Not found.',{e:true});return}
    var p=pages[id],bm=getBookmarks();
    if(bm.some(function(b){return b.title===p.title})){w('Already bookmarked!',{d:true});return}
    var snap=(p.extract||'').split('\n').filter(Boolean).slice(0,3).join(' ').substring(0,200);
    bm.push({title:p.title,url:p.canonicalurl||'',lang:lang,saved:new Date().toISOString(),snip:snap});
    saveBookmarks(bm);
    w('Bookmarked "'+esc(p.title)+'"',{ok:true});
    toastMsg('Bookmarked: '+p.title);
  }).catch(function(e){w('Error: '+esc(e.message),{e:true})});
}

function cmdBookmarks(){
  var bm=getBookmarks();
  if(!bm.length){w('No bookmarks. Use "save <title>" to add one.',{d:true});return}
  line();w('Bookmarks ('+bm.length+'):',{d:true});line();
  for(var bi=0;bi<bm.length;bi++){
    var b=bm[bi];
    w('<div class="a"><div class="at"><span style="color:var(--dim)">'+(bi+1)+'.</span> <span class="al" onclick="runCmd(\'open '+esc(b.title.replace(/'/g,"\\'"))+'\')">'+esc(b.title)+'</span> <span style="color:var(--dim)">('+b.lang+')</span>'+
      (b.snip?'<br><span style="color:var(--dim);font-size:calc(var(--fs)-2px)">'+esc(b.snip)+'...</span>':'')+
      '<br><span style="color:var(--dim);font-size:calc(var(--fs)-3px)">'+b.saved.slice(0,10)+' | <span style="cursor:pointer;color:var(--accent)" onclick="runCmd(\'remove '+(bi+1)+'\')">remove</span></span></div></div>');
  }
  line();
  w('<div class="a"><div class="at">Total: '+bm.length+' bookmarks | <span class="dl-btn" onclick="runCmd(\'export\')">Export as JSON</span></div></div>');
}

function cmdRemoveBm(n){
  var bm=getBookmarks();
  if(!n){w('Usage: remove <number>',{d:true});return}
  var idx=parseInt(n)-1;
  if(isNaN(idx)||idx<0||idx>=bm.length){w('Invalid bookmark number.',{d:true});return}
  var title=bm[idx].title;
  bm.splice(idx,1);saveBookmarks(bm);
  w('Removed bookmark "'+esc(title)+'"',{d:true});
}

function cmdExport(){
  var bm=getBookmarks();
  if(!bm.length){w('No bookmarks to export.',{d:true});return}
  var json=JSON.stringify(bm,null,2);
  downloadBlob(json,'wikish_bookmarks_'+new Date().toISOString().slice(0,10)+'.json','application/json');
  w('Exported '+bm.length+' bookmarks as JSON ('+(json.length/1024).toFixed(1)+'KB)',{ok:true});
  toastMsg('Bookmarks exported');
}

// ---- Stats ----
function cmdStats(t){
  if(!t){w('Usage: stats <title>',{d:true});return}
  t=resolveTitle(t);
  w('Analyzing "'+esc(t)+'"...',{d:true});
  api('query',{prop:'extracts|info|pageprops',explaintext:1,exlimit:1,titles:t,inprop:'url|protection',ppprop:'wikibase_item|page_image_free|displaytitle'}).then(function(d){
    var pages=d.query&&d.query.pages||{},id=Object.keys(pages)[0];
    if(!id||id==='-1'){w('Not found.',{e:true});return}
    var p=pages[id],ext=p.extract||'';
    line();
    w('<div class="ah1">Statistics: '+esc(p.title)+'</div>');
    line();
    var stats=[];
    var chars=ext.length;
    var words=ext.split(/\s+/).filter(Boolean).length;
    var sentences=ext.split(/[.!?]+/).filter(Boolean).length;
    var paras=ext.split('\n').filter(function(l){return l.trim().length>0}).length;
    var sections=ext.split('\n').filter(function(l){return l.trim().indexOf('== ')===0}).length;
    stats.push(['Title',p.title]);
    stats.push(['Page ID',id]);
    stats.push(['Language',lang.toUpperCase()]);
    stats.push(['Characters',chars.toLocaleString()]);
    stats.push(['Words',words.toLocaleString()]);
    stats.push(['Sentences',sentences.toLocaleString()]);
    stats.push(['Paragraphs',paras.toLocaleString()]);
    stats.push(['Sections',sections]);
    stats.push(['Reading time (200 wpm)',Math.ceil(words/200)+' min']);
    stats.push(['Reading time (300 wpm)',Math.ceil(words/300)+' min']);
    var sizeKB=(ext.length/1024).toFixed(1);
    stats.push(['Text size',sizeKB+' KB']);
    if(p.pageprops&&p.pageprops.wikibase_item)stats.push(['Wikidata ID',p.pageprops.wikibase_item]);
    if(p.touched)stats.push(['Last touched',p.touched.slice(0,10)]);
    stats.push(['View URL',p.canonicalurl||'']);
    for(var si=0;si<stats.length;si++){
      w('<div class="a"><div class="at"><span style="color:var(--dim);display:inline-block;width:160px">'+esc(stats[si][0])+':</span>'+esc(stats[si][1])+'</div></div>');
    }
    w('<div class="a"><div class="at" style="margin-top:8px"><span class="dl-btn" onclick="runCmd(\'download '+esc(t.replace(/'/g,"\\'"))+'\')">Download TXT</span></div></div>');
  }).catch(function(e){w('Error: '+esc(e.message),{e:true})});
}

// ---- Table of Contents ----
function cmdToc(t){
  if(!t){w('Usage: toc <title>',{d:true});return}
  t=resolveTitle(t);
  w('Generating table of contents for "'+esc(t)+'"...',{d:true});
  api('query',{prop:'extracts',explaintext:1,exlimit:1,titles:t}).then(function(d){
    var pages=d.query&&d.query.pages||{},id=Object.keys(pages)[0];
    if(!id||id==='-1'){w('Not found.',{e:true});return}
    var ext=pages[id].extract||'';
    var lines=ext.split('\n');
    var toc=[];
    for(var li=0;li<lines.length;li++){
      var l=lines[li].trim();
      if(l.indexOf('== ')===0&&l.lastIndexOf(' ==')===l.length-3){
        toc.push({level:2,title:l.replace(/==\s*/g,'').trim()});
      } else if(l.indexOf('=== ')===0&&l.lastIndexOf(' ===')===l.length-4){
        toc.push({level:3,title:l.replace(/===\s*/g,'').trim()});
      }
    }
    if(!toc.length){w('No sections found in this article.',{d:true});return}
    line();
    w('<div class="ah1">Table of Contents: '+esc(pages[id].title)+'</div>');
    w('<div class="at" style="color:var(--dim);margin-bottom:8px">'+toc.length+' sections</div>');
    line();
    for(var ti=0;ti<toc.length;ti++){
      var indent=toc[ti].level===3?'&nbsp;&nbsp;&nbsp;&nbsp;':'';
      w('<div class="a"><div class="at">'+indent+'<span style="color:var(--dim)">'+(ti+1)+'.</span> <span class="al" onclick="runCmd(\'open '+esc(t.replace(/'/g,"\\'"))+'\')">'+esc(toc[ti].title)+'</span></div></div>');
    }
    line();
    w('<div class="a"><div class="at"><span class="dl-btn" onclick="runCmd(\'read '+esc(t.replace(/'/g,"\\'"))+'\')">Read full article</span></div></div>');
  }).catch(function(e){w('Error: '+esc(e.message),{e:true})});
}

// ---- Find within article ----
function cmdFind(q){
  if(!q){w('Usage: find <text>',{d:true});return}
  if(!currentArticle&&!currentArticleFull){w('No article loaded. Use "open" or "read" first.',{d:true});return}
  var text=currentArticleFull||(currentArticle?currentArticle.extract:'');
  if(!text){w('No article content available.',{d:true});return}
  var lower=q.toLowerCase();
  var lines=text.split('\n');
  var results=[];
  for(var li=0;li<lines.length;li++){
    if(lines[li].toLowerCase().indexOf(lower)!==-1){
      var context=lines[li].trim().substring(0,200);
      results.push({line:li+1,text:context});
    }
  }
  currentFindResults=results;
  if(!results.length){w('No matches for "'+esc(q)+'".',{d:true});return}
  line();
  w('Found '+results.length+' matches for "'+esc(q)+'":',{ok:true});
  line();
  var maxShow=Math.min(results.length,30);
  for(var ri=0;ri<maxShow;ri++){
    var r=results[ri];
    var highlighted=r.text.replace(new RegExp(esc(q),'gi'),function(m){return '<span style="background:#ff0;color:#000">'+m+'</span>'});
    w('<div class="a"><div class="at"><span style="color:var(--dim)">L'+r.line+':</span> '+highlighted+'</div></div>');
  }
  if(results.length>30)w('<div class="a"><div class="at" style="color:var(--dim)">... and '+(results.length-30)+' more matches</div></div>');
}

// ---- Settings ----
function cmdSettings(){
  var s=loadSettings(),sb=document.getElementById('settingsBody');
  var colorRow=function(label,key){return '<div class="sf"><label>'+label+'</label><input type="color" value="'+s[key]+'" onchange="updateSetting(\''+key+'\',this.value)"></div>'};
  var rangeRow=function(label,key,min,max,step,unit){return '<div class="sf"><label>'+label+' <span class="val" id="v_'+key+'">'+s[key]+(unit||'')+'</span></label><input type="range" min="'+min+'" max="'+max+'" step="'+(step||1)+'" value="'+s[key]+'" oninput="updateSetting(\''+key+'\',this.value);document.getElementById(\'v_'+key+'\').textContent=this.value'+(unit?"+'"+unit+"'":"")+'"></div>'};
  var selectRow=function(label,key,opts){return '<div class="sf"><label>'+label+'</label><select onchange="updateSetting(\''+key+'\',this.value)">'+opts.map(function(o){return '<option value="'+o.val+'"'+(s[key]===o.val?' selected':'')+'>'+o.label+'</option>'}).join('')+'</select></div>'};
  sb.innerHTML=
    '<div class="sg"><h4>Colors</h4>'+
    colorRow('Background','bg')+colorRow('Text','fg')+colorRow('Dim text','dim')+
    colorRow('Accent / links','accent')+colorRow('Accent hover','accentHover')+
    colorRow('Dividers','line')+colorRow('Card bg','cardBg')+colorRow('Card border','cardBorder')+
    colorRow('Input bg','inputBg')+colorRow('Input border','inputBorder')+
    colorRow('Bar bg','barBg')+colorRow('Bar text','barFg')+'</div>'+
    '<div class="sg"><h4>Typography</h4>'+
    selectRow('Font','font',[
      {val:'Courier New, monospace',label:'Courier New'},{val:'Consolas, monospace',label:'Consolas'},
      {val:'monospace',label:'Monospace'},{val:'Georgia, serif',label:'Georgia'},
      {val:'Arial, sans-serif',label:'Arial'},{val:'"Segoe UI", Arial, sans-serif',label:'Segoe UI'},
      {val:'"Times New Roman", serif',label:'Times New Roman'},{val:'"Roboto Mono", monospace',label:'Roboto Mono'},
      {val:'"JetBrains Mono", monospace',label:'JetBrains Mono'}])+
    rangeRow('Font size (px)','fs','10','28','1','px')+
    rangeRow('Line height','lh','1.0','2.5','0.1')+'</div>'+
    '<div class="sg"><h4>Layout</h4>'+
    rangeRow('Padding X (px)','padX','8','48','2','px')+
    rangeRow('Padding Y (px)','padY','4','32','2','px')+
    rangeRow('Border radius (px)','radius','0','20','1','px')+'</div>'+
    '<div class="sg"><button class="sreset" onclick="resetSettings()">Reset to defaults</button></div>';
  document.getElementById('overlay').classList.add('open');
  document.getElementById('settings').classList.add('open');
}
function updateSetting(key,val){
  var s=loadSettings();s[key]=val;saveSettings(s);SETTINGS=s;applySettings(s);
}
function closeSettings(){
  document.getElementById('settings').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
}
function resetSettings(){
  saveSettings(Object.assign({},DEFAULTS));SETTINGS=loadSettings();applySettings(SETTINGS);
  cmdSettings();
}

// ---- About ----
function cmdAbout(){
  clearScr();
  w('<div class="ah1">wik.sh</div>');
  w('Wikipedia terminal -- pure frontend knowledge engine');
  line();
  w('Powered by the MediaWiki API',{d:true});
  w('Download articles (TXT/HTML/MD), download images, bookmarks, stats, TOC, find-in-article, export',{d:true});
  line();
  w('Commands: help, search, open, read, random, download, dlhtml, dlmd, dlimg,',{d:true});
  w('  save, bookmarks, remove, stats, toc, find, export, images, links, categories,',{d:true});

// ---- Autocomplete ----
function showSuggest(input){
  var parts=input.split(/\s+/),partial=parts[parts.length-1].toLowerCase();
  if(!partial||input.trim().length<2){suggestEl.classList.remove('active');return}
  if(parts.length===1){
    var cmds=Object.keys({help:1,search:1,open:1,read:1,random:1,more:1,back:1,clear:1,history:1,related:1,lang:1,top:1,images:1,links:1,categories:1,suggestions:1,geosearch:1,feed:1,featured:1,settings:1,about:1,download:1,dlhtml:1,dlmd:1,dlimg:1,save:1,bookmarks:1,remove:1,stats:1,toc:1,find:1,export:1}).filter(function(c){return c.indexOf(partial)===0}).sort();
    if(cmds.length&&cmds.length<25){
      suggestEl.innerHTML=cmds.map(function(c,i){return '<div class="si" onclick="suggestPick(\''+c+'\')" onmouseenter="sugHL='+i+';renderSugHL()">'+c+'</div>'}).join('');
      suggestEl.classList.add('active');sugHL=-1;return;
    }
  }
  suggestEl.classList.remove('active');
}
var sugHL=-1;
function renderSugHL(){suggestEl.querySelectorAll('.si').forEach(function(el,i){el.classList.toggle('hl',i===sugHL)})}
function suggestPick(c){var p=cmdEl.value.split(/\s+/);p.pop();p.push(c);cmdEl.value=p.join(' ')+' ';suggestEl.classList.remove('active');cmdEl.focus()}

// ---- Keyboard ----
cmdEl.addEventListener('keydown',function(e){
  if(e.key==='Enter'){e.preventDefault();var v=cmdEl.value.trim();cmdEl.value='';if(v)process(v)}
  else if(e.key==='ArrowUp'){e.preventDefault();if(cmdHistory.length&&histIdx>0){histIdx--;cmdEl.value=cmdHistory[histIdx]}}
  else if(e.key==='ArrowDown'){e.preventDefault();if(histIdx<cmdHistory.length-1){histIdx++;cmdEl.value=cmdHistory[histIdx]}else{histIdx=cmdHistory.length;cmdEl.value=''}}
  else if(e.key==='Tab'){e.preventDefault();var val=cmdEl.value,parts=val.split(/\s+/),partial=parts[parts.length-1]||'';
    var matches=Object.keys({help:1,search:1,open:1,read:1,random:1,more:1,back:1,clear:1,history:1,related:1,lang:1,top:1,images:1,links:1,categories:1,suggestions:1,geosearch:1,feed:1,featured:1,settings:1,about:1,download:1,dlhtml:1,dlmd:1,dlimg:1,save:1,bookmarks:1,remove:1,stats:1,toc:1,find:1,export:1}).filter(function(c){return c.indexOf(partial)===0});
    if(matches.length===1){parts[parts.length-1]=matches[0];cmdEl.value=parts.join(' ')+' '}}
  else if(e.key==='Escape'){suggestEl.classList.remove('active');cmdEl.blur()}
});
cmdEl.addEventListener('input',function(){showSuggest(cmdEl.value)});
document.addEventListener('click',function(e){
  if(!e.target.closest('#suggest')&&!e.target.closest('#cmd'))suggestEl.classList.remove('active');
});
function runCmd(s){cmdEl.value=s;process(s)}
splashEl.addEventListener('click',boot);
</script>
